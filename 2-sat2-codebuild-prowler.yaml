AWSTemplateFormatVersion: 2010-09-09
Description: Self-Service Security Assessment Solutions (v2)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: SATv2 options
        Parameters:
          - ProwlerScanType
          - MultiAccountScan
          - Reporting
          - EmailAddress
      - Label:
          default: Advanced options
        Parameters:
          - ConcurrentAccountScans
          - CodeBuildTimeout
          - MultiAccountListOverride
          - ProwlerOptions
          - ProwlerRole
          - SourceRepoUrl
          - SourceRepoBranch
      - Label:
          default: Resource tags
        Parameters:
          - ProjectTag
          - EnvironmentTag

    ParameterLabels:
      ProwlerOptions:
        default: Prowler options
      ProwlerScanType:
        default: Prowler scan type
      ProwlerRole:
        default: Prowler role
      MultiAccountScan:
        default: Multi-Account scan
      MultiAccountListOverride:
        default: Multi-Account list override
      EmailAddress:
        default: (Optional) Email address
      Reporting:
        default: Reporting
      ConcurrentAccountScans:
        default: Concurrent account scans
      CodeBuildTimeout:
        default: CodeBuild timeout
      SourceRepoUrl:
        default: Source repository URL
      SourceRepoBranch:
        default: Source repository branch
      ProjectTag:
        default: Project tag
      EnvironmentTag:
        default: Environment tag

Parameters:
  ProwlerOptions:
    Description: 'Specify the parameters for Prowler. The --role and ARN will automatically be added to the end of the parameters you specify.'
    Type: String
    Default: aws --ignore-exit-code-3
  ProwlerScanType:
    Description: 'Specify which type of scan to perform. A basic scan runs 13 checks. An Intermediate scan runs all 109+ critical and high checks. A Full scan runs all 383+ checks.'
    Type: String
    AllowedValues:
      - 'Basic'
      - 'Intermediate'
      - 'Full'
    Default: 'Intermediate'
  ProwlerRole:
    Description: 'The role that Prowler should assume to perform the scan.'
    Type: String
    Default: ProwlerMemberRole
  MultiAccountScan:
    Description: 'Set this to true if you want to scan all accounts in your organization. You must have deployed the prerequisite template to provision a role, or specify a different ProwlerRole with the appropriate permissions.'
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  MultiAccountListOverride:
    Description: 'Specify a space delimited list of accounts to scan. Leaving this blank will scan all accounts in your organization.'
    Type: String
    Default: ''
    AllowedPattern: '^$|^\d{12}(\s+\d{12})*$'
    ConstraintDescription: 'Must be empty or a space-separated list of 12-digit AWS account IDs (e.g., "123456789012 234567890123")'
  EmailAddress:
    Description: 'Specify an address if you want to receive an email when the scan completes.'
    Type: String
    Default: ''
  Reporting:
    Description: 'Set this to true if you want to summarize the reports and use the dashboard. This is helpful when scanning multiple accounts.'
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  ConcurrentAccountScans:
    Description: 'For multi-account scans, specify the number of accounts to scan concurrently. This is useful for large organizations with many accounts. Selecting more than three may incur additional costs.'
    Type: String
    AllowedValues:
      - 'Three'
      - 'Six'
      - 'Twelve'
      - 'FortyEight'
    Default: 'Three'
  CodeBuildTimeout:
    Description: 'Set the timeout for the CodeBuild job. The default is 300 minutes (5 hours). Maximum is 2160 minutes (36 hours).'
    Type: Number
    MinValue: 5
    MaxValue: 2160
    Default: 300
  SourceRepoUrl:
    Description: 'Git repository URL for the reporting code. Must be from trusted GitHub organizations (awslabs, aws, agasthik).'
    Type: String
    Default: 'https://github.com/awslabs/aws-security-assessment-solution.git'
    AllowedPattern: '^https://github\.com/(awslabs|aws|agasthik)/[a-zA-Z0-9_.-]+\.git$'
    ConstraintDescription: 'Must be a valid GitHub HTTPS URL from trusted organizations (awslabs, aws, or agasthik). Format: https://github.com/{org}/{repo}.git'
  SourceRepoBranch:
    Description: 'Git branch to use for the reporting code.'
    Type: String
    Default: 'main'
  ProjectTag:
    Description: 'Project name for resource tagging and cost allocation.'
    Type: String
    Default: 'SecurityAssessment'
  EnvironmentTag:
    Description: 'Environment name for resource tagging (e.g., Production, Development, Staging).'
    Type: String
    Default: 'Production'
    AllowedValues:
      - 'Production'
      - 'Development'
      - 'Staging'
      - 'Test'

Conditions:
  CreateProwlerRole: !Equals
    - !Ref MultiAccountScan
    - false

  CreateEmailNotification: !Not [!Equals [!Ref EmailAddress, '']]

  EnableReporting: !Equals
    - !Ref Reporting
    - true

Mappings:
  ProwlerScanParameters:
    Basic:
      ProwlerOptions: >
        -c
        account_maintain_current_contact_details
        awslambda_function_using_supported_runtimes
        cloudtrail_multi_region_enabled
        config_recorder_all_regions_enabled
        ec2_securitygroup_allow_ingress_from_internet_to_any_port
        guardduty_is_enabled
        iam_password_policy_lowercase
        iam_password_policy_number
        iam_password_policy_symbol
        iam_password_policy_uppercase
        iam_root_mfa_enabled
        iam_rotate_access_key_90_days
        s3_bucket_public_access
    Intermediate:
      ProwlerOptions: --severity critical high
    Full:
      ProwlerOptions: ''
  CodeBuildPerformanceOptionMap:
    Three:
      ParallelAccounts: 3
      CodeBuildComputeType: BUILD_GENERAL1_SMALL
    Six:
      ParallelAccounts: 6
      CodeBuildComputeType: BUILD_GENERAL1_MEDIUM
    Twelve:
      ParallelAccounts: 12
      CodeBuildComputeType: BUILD_GENERAL1_LARGE
    FortyEight:
      ParallelAccounts: 48
      CodeBuildComputeType: BUILD_GENERAL1_XLARGE

Resources:
  #This is the role that CodeBuild assumes to perform the Prowler scan
  ProwlerIntegrationCodeBuildRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: Role allows * in resource policy. The role needs broad, read-only privileges to review all resources. Only the CodeBuild role created as part of this solution can assume this role.
          - id: W28
            reason: Resource has an explicit name so Prowler can loop through and assume it in each account.
          - id: W76
            reason: SPCM for IAM policy is higher than 25 due to managed polices, and additional polices. Each section of the role has a comment with the Prowler documentation describing the need for the privileges.
    Condition: CreateProwlerRole
    Type: 'AWS::IAM::Role'
    Properties:
      Path: '/service-role/'
      RoleName: ProwlerMemberRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'sts:AssumeRole'
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/ProwlerCodeBuildRole
      ManagedPolicyArns:
        # Prowler requires these managed polices to perform all the checks
        # https://docs.prowler.cloud/en/latest/getting-started/requirements/
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/SecurityAudit'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess'
      Policies:
        # Prowler requires these additional read-only permissions. They are documented in the Prowler documentation.
        # https://github.com/prowler-cloud/prowler/blob/master/permissions/prowler-additions-policy.json
        - PolicyName: ProwlerAdditions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - account:Get*
                  - appstream:Describe*
                  - appstream:List*
                  - backup:List*
                  - backup:Get*
                  - bedrock:List*
                  - bedrock:Get*
                  - cloudtrail:GetInsightSelectors
                  - codeartifact:List*
                  - codebuild:BatchGet*
                  - codebuild:ListReportGroups
                  - cognito-idp:GetUserPoolMfaConfig
                  - dlm:Get*
                  - drs:Describe*
                  - ds:Get*
                  - ds:Describe*
                  - ds:List*
                  - dynamodb:GetResourcePolicy
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:GetSnapshotBlockPublicAccessState
                  - ec2:GetInstanceMetadataDefaults
                  - ecr:Describe*
                  - ecr:GetRegistryScanningConfiguration
                  - elasticfilesystem:DescribeBackupPolicy
                  - glue:GetConnections
                  - glue:GetSecurityConfiguration*
                  - glue:SearchTables
                  - glue:GetMLTransforms
                  - lambda:GetFunction*
                  - lightsail:GetRelationalDatabases
                  - logs:FilterLogEvents
                  - macie2:GetMacieSession
                  - macie2:GetAutomatedDiscoveryConfiguration
                  - s3:GetAccountPublicAccessBlock
                  - shield:DescribeProtection
                  - shield:GetSubscriptionState
                  - securityhub:BatchImportFindings
                  - securityhub:GetFindings
                  - servicecatalog:Describe*
                  - servicecatalog:List*
                  - ssm:DescribeDocumentPermission
                  - ssm:GetDocument
                  - ssm-incidents:List*
                  - states:ListTagsForResource
                  - support:Describe*
                  - tag:GetTagKeys
                  - wellarchitected:List*
                Effect: Allow
                Resource: '*'
              - Action:
                  - apigateway:GET
                Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:*::/restapis/*
                  - !Sub arn:${AWS::Partition}:apigateway:*::/apis/*
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerFindingsBucket:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: No bucket logging needed.
          - id: W41
            reason: Amazon S3 now applies server-side encryption with Amazon S3 managed keys (SSE-S3) as the base level of encryption for every bucket in Amazon S3.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: !If [EnableReporting, true, false]
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
  ProwlerFindingsBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref ProwlerFindingsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSSLRequestsOnly
            Principal: '*'
            Action: 's3:*'
            Effect: Deny
            Resource:
              - !Sub '${ProwlerFindingsBucket.Arn}'
              - !Sub '${ProwlerFindingsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CodeBuildStartBuild:
    Type: Custom::CodeBuildStartBuild
    Properties:
      ServiceToken: !GetAtt CodeBuildStartBuildLambda.Arn
      ProjectName: !Ref ProwlerCodeBuild

  CodeBuildStartBuildLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartBuildInline
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'codebuild:StartBuild'
                Resource: !GetAtt ProwlerCodeBuild.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  CodeBuildStartBuildLogsGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CodeBuildStartBuildLambda}'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  CodeBuildStartBuildLambda:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: The CodeBuildStartBuildLambdaRole gives Lambda access to write CloudWatch logs.
          - id: W89
            reason: Lambda is not deployed inside of a VPC. The Lambda function is used to start the CodeBuild job as a custom CloudFormation resource.
          - id: W92
            reason: Reserved concurrent executions is not set.
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !Sub ${CodeBuildStartBuildLambdaRole.Arn}
      Timeout: 120
      Runtime: python3.12
      Code:
        ZipFile: |
          import boto3
          from botocore.exceptions import ClientError
          import cfnresponse

          def startBuild(event, context):
            responseData = {}
            cb = boto3.client('codebuild')
            try:
              print("Starting build...")
              response = cb.start_build(projectName=event['ResourceProperties']['ProjectName'])
              responseData['buildID'] = response['build']['id']
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
            except ClientError as e:
              print("Failed to start build")
              print(e)
              cfnresponse.send(event, context, cfnresponse.FAILED, e.response)

          def no_op(event, context):
            responseData = {}
            cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)

          def lambda_handler(event,context):
            print(event)
            if event['RequestType'] == 'Create':
              startBuild(event, context)
            else:
              no_op(event,context)
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  #This is the role that has privileges to assume Prowler member roles
  ProwlerCodeBuildRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: ListAccounts does not support resource types.
          - id: W28
            reason: This role is given an explicit name to further restrict the more permissive ProwlerMemberRole to only be assumed by this role.
    Type: AWS::IAM::Role
    Properties:
      Path: '/service-role/'
      RoleName: ProwlerCodeBuildRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/ProwlerCodeBuild'
      Policies:
        - PolicyName: LogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Effect: Allow
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        - PolicyName: UploadtoS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - s3:PutObject
                Effect: Allow
                Resource: !Sub '${ProwlerFindingsBucket.Arn}/*'
        - PolicyName: AssumeRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/service-role/${ProwlerRole}'
        - PolicyName: ListOrganizationAccounts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - organizations:ListAccounts
                  - organizations:DescribeAccount
                  - organizations:ListTagsForResource
                Effect: Allow
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerCodeBuild:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: CodeBuild uses the managed KMS key for S3.
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ProwlerCodeBuild
      Environment:
        ComputeType:
          !FindInMap [
            CodeBuildPerformanceOptionMap,
            !Ref ConcurrentAccountScans,
            'CodeBuildComputeType',
          ]
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: BUCKET_REPORT
            Value: !Ref ProwlerFindingsBucket
            Type: PLAINTEXT
          - Name: PROWLER_OPTIONS
            Value: !Ref 'ProwlerOptions'
            Type: PLAINTEXT
          - Name: PROWLER_SCAN_OPTIONS
            Value:
              !FindInMap [
                ProwlerScanParameters,
                !Ref ProwlerScanType,
                'ProwlerOptions',
              ]
            Type: PLAINTEXT
          - Name: PROWLER_ROLE
            Value: !Ref ProwlerRole
            Type: PLAINTEXT
          - Name: MULTI_ACCOUNT_SCAN
            Value: !Ref MultiAccountScan
            Type: PLAINTEXT
          - Name: MULTI_ACCOUNT_LIST_OVERRIDE
            Value: !Ref MultiAccountListOverride
            Type: PLAINTEXT
          - Name: AWS_PARTITION
            Value: !Sub ${AWS::Partition}
            Type: PLAINTEXT
          - Name: AWS_ACCOUNT_ID
            Value: !Sub ${AWS::AccountId}
            Type: PLAINTEXT
          - Name: PARALLEL_ACCOUNTS
            Value:
              !FindInMap [
                CodeBuildPerformanceOptionMap,
                !Ref ConcurrentAccountScans,
                'ParallelAccounts',
              ]
            Type: PLAINTEXT
      Description: Run Prowler assessment
      ServiceRole: !GetAtt ProwlerCodeBuildRole.Arn
      TimeoutInMinutes: !Ref CodeBuildTimeout
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo "Installing uv and Prowler..."
                - |
                  if ! curl -LsSf https://astral.sh/uv/install.sh | sh; then
                    echo "ERROR: Failed to install uv"
                    exit 1
                  fi
                - source $HOME/.local/bin/env
                - |
                  if ! uv pip install --system prowler==5.26.1 --quiet; then
                    echo "ERROR: Failed to install Prowler"
                    exit 1
                  fi
                - prowler -v
            build:
              commands:
                - |

                  if [[ $MULTI_ACCOUNT_SCAN = 'true' ]]; then

                      echo "Running multi-account scan."

                      if [[ $MULTI_ACCOUNT_LIST_OVERRIDE != '' ]]; then
                          echo "Using account overrides."
                          account_list=$MULTI_ACCOUNT_LIST_OVERRIDE
                      elif [[ $MULTI_ACCOUNT_LIST_OVERRIDE = '' ]]; then
                          echo "Using accounts from aws organizations."
                          if ! account_list=$(aws organizations list-accounts --query 'Accounts[?Status==`ACTIVE`].Id' --output text); then
                              echo "ERROR: Failed to retrieve account list from AWS Organizations"
                              exit 1
                          fi
                      fi

                      if [[ -z "$account_list" ]]; then
                          echo "ERROR: No accounts found to scan"
                          exit 1
                      fi

                      echo "Using accounts $account_list."

                      # Use temp file to track failed accounts from subshells
                      FAILED_ACCOUNTS_FILE=$(mktemp)
                      for accountId in $account_list; do
                          test "$(jobs | wc -l)" -ge $PARALLEL_ACCOUNTS && wait || true
                          {
                              echo "Running Prowler as prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$accountId:role/service-role/$PROWLER_ROLE "
                              prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$accountId:role/service-role/$PROWLER_ROLE -b
                              PROWLER_EXIT_CODE=$?
                              if [ $PROWLER_EXIT_CODE -ne 0 ]; then
                                  echo "ERROR: Prowler scan failed for account $accountId"
                                  echo "$accountId" >> "$FAILED_ACCOUNTS_FILE"
                              fi
                          } &
                      done

                      wait

                      if [[ -s "$FAILED_ACCOUNTS_FILE" ]]; then
                          echo "WARNING: Prowler scans failed for the following accounts:"
                          cat "$FAILED_ACCOUNTS_FILE"
                          echo "Check logs above for specific error details"
                          rm -f "$FAILED_ACCOUNTS_FILE"
                          exit 1
                      fi
                      rm -f "$FAILED_ACCOUNTS_FILE"

                  elif [[ $MULTI_ACCOUNT_SCAN != 'true' ]]; then

                      echo "Running a single account scan."
                      echo "Running Prowler as prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$AWS_ACCOUNT_ID:role/service-role/$PROWLER_ROLE "
                      prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$AWS_ACCOUNT_ID:role/service-role/$PROWLER_ROLE -b
                      PROWLER_EXIT_CODE=$?
                      if [ $PROWLER_EXIT_CODE -ne 0 ]; then
                          echo "ERROR: Prowler scan failed for account $AWS_ACCOUNT_ID with exit code $PROWLER_EXIT_CODE"
                          exit $PROWLER_EXIT_CODE
                      fi

                  fi
            post_build:
              commands:
                - echo "CODEBUILD_BUILD_SUCCEEDING status is $CODEBUILD_BUILD_SUCCEEDING "
                - |

                  if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ]; then
                      echo "The previous build stage Failed. Exiting the post_build stage without uploading any results to S3 buckets";
                      exit $CODEBUILD_BUILD_SUCCEEDING
                  elif [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
                      echo "The build stage succeeded. Now uploading reports to S3 bucket ..."

                      upload_failed=false

                      echo "Uploading CSV reports..."
                      if ! aws s3 cp --exclude "*" --include "*.csv" --exclude "compliance**" output/ s3://$BUCKET_REPORT/csv/ --recursive; then
                          echo "ERROR: Failed to upload CSV reports"
                          upload_failed=true
                      fi

                      echo "Uploading compliance CSV reports..."
                      if ! aws s3 cp --exclude "*" --include "*.csv" output/compliance/ s3://$BUCKET_REPORT/compliance/ --recursive; then
                          echo "ERROR: Failed to upload compliance CSV reports"
                          upload_failed=true
                      fi

                      echo "Uploading OCSF JSON reports..."
                      if ! aws s3 cp --exclude "*" --include "*.ocsf.json" output/ s3://$BUCKET_REPORT/ocsf-json/ --recursive; then
                          echo "ERROR: Failed to upload OCSF JSON reports"
                          upload_failed=true
                      fi

                      echo "Uploading JSON reports..."
                      if ! aws s3 cp --exclude "*" --include "*.json" --exclude "*.ocsf.json" --exclude "*.asff.json" output/ s3://$BUCKET_REPORT/json/ --recursive; then
                          echo "ERROR: Failed to upload JSON reports"
                          upload_failed=true
                      fi

                      echo "Uploading HTML reports..."
                      if ! aws s3 cp --exclude "*" --include "*.html" output/ s3://$BUCKET_REPORT/html/ --recursive; then
                          echo "ERROR: Failed to upload HTML reports"
                          upload_failed=true
                      fi

                      echo "Uploading ASFF JSON reports..."
                      if ! aws s3 cp --exclude "*" --include "*.asff.json" output/ s3://$BUCKET_REPORT/asff-json/ --recursive; then
                          echo "ERROR: Failed to upload ASFF JSON reports"
                          upload_failed=true
                      fi

                      if [[ $upload_failed == true ]]; then
                          echo "ERROR: One or more S3 uploads failed. Check logs above for details."
                          exit 1
                      fi

                      echo "All reports uploaded successfully!"
                  fi
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerLogGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${ProwlerCodeBuild}'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerScanNotificationTopic:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W47
            reason: Topic is used to send notification that the scan is done. Topic does not use AWS KMS CMK or default key. If SNS uses the default AWS KMS key alias/aws/sns, then EventBridge can't publish messages to the SNS topic. The default KMS key policy for SNS doesn't allow EventBridge kms:decrypt and kms:GenerateDataKey.
    Condition: CreateEmailNotification
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Endpoint: !Ref EmailAddress
          Protocol: email
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerSnsNotificationsPolicy:
    Condition: CreateEmailNotification
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Id: snsNotificationsPolicy
        Version: '2012-10-17'
        Statement:
          - Sid: Allow events
            Effect: Allow
            Principal:
              Service: 'events.amazonaws.com'
            Action:
              - sns:Publish
            Resource: !Ref ProwlerScanNotificationTopic
      Topics:
        - !Ref ProwlerScanNotificationTopic

  CodeBuildStateChangeRule:
    Condition: CreateEmailNotification
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - SUCCEEDED
            - FAILED
            - STOPPED
          project-name:
            - !Ref ProwlerCodeBuild
      State: ENABLED
      Targets:
        - Id: toSNS
          Arn: !Ref ProwlerScanNotificationTopic
          InputTransformer:
            InputPathsMap:
              build-status: $.detail.build-status
              bucket: $.detail.additional-information.environment.environment-variables[0].value
            InputTemplate: >-
              "The Prowler scan has <build-status>."

              "You can view your results in the <bucket> bucket."
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  # Security Insights Dashboard Reporting
  ProwlerReportingLambdaRole:
    Condition: EnableReporting
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AccessToCodeBuild
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'codebuild:StartBuild'
                Resource: !GetAtt ProwlerReportingCodeBuild.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerReportingLogGroup:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProwlerReportingLambda}'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerReportingLambda:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: The ProwlerReportingLambdaRole gives Lambda access to write CloudWatch logs.
          - id: W89
            reason: Lambda is not deployed inside of a VPC.
          - id: W92
            reason: Reserved concurrent executions is not set.
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !Sub ${ProwlerReportingLambdaRole.Arn}
      Timeout: 120
      Runtime: python3.12
      Environment:
        Variables:
          CODEBUILD_PROJECT_NAME: !Ref ProwlerReportingCodeBuild
      Code:
        ZipFile: |
          import os
          import boto3
          from botocore.exceptions import ClientError

          def startCodeBuildReport(event, context):
              print(event)
              print("Starting reporting CodeBuild to generate security insights dashboard...")

              project_name = os.environ['CODEBUILD_PROJECT_NAME']
              cb = boto3.client('codebuild')
              try:
                print(f"Starting build for project: {project_name}")
                response = cb.start_build(projectName=project_name)
                print(response)
              except ClientError as e:
                print("Failed to start CodeBuild")
                print(e)

          def lambda_handler(event,context):
              startCodeBuildReport(event, context)
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerReportingLambdaInvokePermission:
    Condition: EnableReporting
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ProwlerReportingLambda.Arn
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt ProwlerReportingTrigger.Arn

  ProwlerReportingTrigger:
    Condition: EnableReporting
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - SUCCEEDED
          project-name:
            - !Ref ProwlerCodeBuild
      State: ENABLED
      Targets:
        - Id: toLambda
          Arn: !GetAtt ProwlerReportingLambda.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerReportingCodeBuildRole:
    Condition: EnableReporting
    Type: AWS::IAM::Role
    Properties:
      Path: '/service-role/'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/ProwlerReportingCodeBuild'
      Policies:
        - PolicyName: LogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Effect: Allow
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        - PolicyName: AccessToS3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:AbortMultipartUpload
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                Resource:
                  - !GetAtt ProwlerFindingsBucket.Arn
                  - !Sub ${ProwlerFindingsBucket.Arn}/*
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

  ProwlerReportingCodeBuild:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: CodeBuild uses the managed KMS key for S3.
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ProwlerReportingCodeBuild
      Environment:
        ComputeType: 'BUILD_GENERAL1_SMALL'
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: BUCKET_REPORT
            Value: !Ref ProwlerFindingsBucket
            Type: PLAINTEXT
          - Name: SOURCE_REPO_URL
            Value: !Ref SourceRepoUrl
            Type: PLAINTEXT
          - Name: SOURCE_REPO_BRANCH
            Value: !Ref SourceRepoBranch
            Type: PLAINTEXT
      Description: Create Prowler report
      ServiceRole: !GetAtt ProwlerReportingCodeBuildRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo "Installing uv..."
                - |
                  if ! curl -LsSf https://astral.sh/uv/install.sh | sh; then
                    echo "ERROR: Failed to install uv"
                    exit 1
                  fi
                - source $HOME/.local/bin/env
                - echo "Downloading repo from $SOURCE_REPO_URL (branch: $SOURCE_REPO_BRANCH)..."
                - |
                  if ! git clone --branch $SOURCE_REPO_BRANCH --single-branch $SOURCE_REPO_URL; then
                    echo "ERROR: Failed to clone repository $SOURCE_REPO_URL (branch: $SOURCE_REPO_BRANCH)"
                    exit 1
                  fi
                - |
                  # Extract repo directory name from URL
                  REPO_DIR=$(basename "$SOURCE_REPO_URL" .git)
                  echo "REPO_DIR=$REPO_DIR" >> $CODEBUILD_SRC_DIR/env.sh
                  REPORTING_DIR="$REPO_DIR/reporting"
                  echo "REPORTING_DIR=$REPORTING_DIR" >> $CODEBUILD_SRC_DIR/env.sh
                - source $CODEBUILD_SRC_DIR/env.sh
                - echo "Installing dependencies from $REPORTING_DIR..."
                - |
                  if ! uv pip install --system -r $REPORTING_DIR/requirements.txt --quiet; then
                    echo "ERROR: Failed to install Python dependencies"
                    exit 1
                  fi
            build:
              commands:
                - source $CODEBUILD_SRC_DIR/env.sh
                - echo "Generating security insights dashboard from s3://$BUCKET_REPORT/csv/"
                - |
                  cd $REPORTING_DIR
                  if ! python generate_cspm_scan_insights.py --output-dir "s3://$BUCKET_REPORT/csv" --dashboard-file cspm_scan_insights.html; then
                    echo "ERROR: Failed to generate security insights dashboard"
                    exit 1
                  fi
            post_build:
              commands:
                - source $CODEBUILD_SRC_DIR/env.sh
                - |
                  if [ "$CODEBUILD_BUILD_SUCCEEDING" = "0" ]; then
                    echo "ERROR: Build phase failed. Skipping dashboard upload."
                    exit 1
                  fi
                - echo "Uploading html dashboard to S3..."
                - |
                  if ! aws s3 cp $REPORTING_DIR/cspm_scan_insights.html s3://$BUCKET_REPORT/reports/; then
                    echo "ERROR: Failed to upload dashboard to S3"
                    exit 1
                  fi
                - echo "Dashboard successfully uploaded to s3://$BUCKET_REPORT/reports/cspm_scan_insights.html"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag

Outputs:
  AccountID:
    Description: Account ID where Prowler is running
    Value: !Ref AWS::AccountId

  ProwlerCodeBuildRoleArn:
    Description: ARN of the Prowler CodeBuild execution role
    Value: !GetAtt ProwlerCodeBuildRole.Arn

  ReportBucketName:
    Description: S3 bucket for Prowler scan results and reports
    Value: !Ref ProwlerFindingsBucket

  ReportBucketUrl:
    Description: S3 console URL for the report bucket
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${ProwlerFindingsBucket}"

  DashboardS3Path:
    Condition: EnableReporting
    Description: S3 path to the security insights dashboard
    Value: !Sub "s3://${ProwlerFindingsBucket}/reports/cspm_scan_insights.html"

  ProwlerCodeBuildProject:
    Description: Name of the Prowler scan CodeBuild project
    Value: !Ref ProwlerCodeBuild

  ReportingCodeBuildProject:
    Condition: EnableReporting
    Description: Name of the reporting CodeBuild project
    Value: !Ref ProwlerReportingCodeBuild

  ProwlerCodeBuildConsoleUrl:
    Description: CodeBuild console URL for Prowler scans
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${ProwlerCodeBuild}"

  ReportingCodeBuildConsoleUrl:
    Condition: EnableReporting
    Description: CodeBuild console URL for reporting
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${ProwlerReportingCodeBuild}"
